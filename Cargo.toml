[package]
name = "aioworldline"
version = "0.5.14"
edition = "2024"
rust-version = "1.98"
description = "Unofficial Worldline portal data retrieving client"
authors = ["Oleg Korsak <kamikaze.is.waiting.you@gmail.com>"]
license = "GPL-3.0"
repository = "https://github.com/kamikaze/aioworldline"
keywords = ["worldline", "payments", "transactions"]
categories = ["finance"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
csv = "1.4.0"
envy = "0.4.2"
pyo3 = { version = "0.30.1", features = ["extension-module"], optional = true }
pyo3-async-runtimes = { version = "0.29.0", features = ["tokio-runtime"], optional = true }
reqwest = { version = "0.13.4", features = ["cookies", "form", "gzip", "rustls", "query"] }
scraper = "0.27.0"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lib]
name = "aioworldline"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3", "dep:pyo3-async-runtimes"]


[profile.dev]
debug = true
incremental = true
opt-level = 0

[profile.release]
codegen-units = 1
debug = false
lto = "fat"
opt-level = 3
panic = "abort"
strip = true

[profile.release.package."*"]
codegen-units = 1
debug = false
opt-level = 3
strip = true
